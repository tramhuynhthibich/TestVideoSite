<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Video Page</title>
    <script src="script.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
        }

        video {
            max-width: 100%;
            height: auto;
            border: 2px solid #333;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Video Page</h1>

    <!-- The Video Player -->
    <video width="1000" controls autoplay muted playsinline loop>
        <source src="Videos/Applaydu_Intro_BASIC_EN.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <!-- <input type="text"> -->
    <!-- <input type="file" accept="image/*" capture="environment"> -->

    <hr />
    <button height="250" onclick="Unity.call('PawPatrol-CloseImageBrowser');">Close In Game Browser</button>

    <hr />
    <a href="https://qr.kinder.com/VS509">https://qr.kinder.com/VS509</a>

    <hr />
    <!-- Upload an image to the server -->
    <div id="uploadSection">
        <input id="imageUpload" type="file" accept="image/*">
        <button onclick="uploadImage()">Upload Image</button>
        <p id="uploadStatus"></p>
        <img id="uploadedImage" style="max-width: 300px; display: none;" alt="Uploaded image">
    </div>

    <hr />
    <p><a href="javascript:void(0)" onclick="testSaveDataURL();">Test saveDataURL</a> (experimental, only for
        Android/iOS)</p>

    <hr />
    <div id="msg">[]</div>
    <!-- <p><a href="javascript:void(0)" onclick="Unity.call('anchor');">[Send Message!]</a></p> -->
    <form method="get" action="form">
        <input id="input1" type="text" value="hoge" name="msg" />
        <input type="submit" value="Send Message!"
            onclick="Unity.call('form?msg=' + document.getElementById('input1').value); return false;" /><br />
        <!-- <input type="file" name="datafile" /> -->
    </form>

</body>

</html>
